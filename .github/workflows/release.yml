name: Release

# workflow_dispatch builds and tests everything but signs nothing and publishes
# nothing, so the expensive macOS path can be exercised from a branch without
# spending a version number on a tag that might not ship.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Test CLI
        env:
          PYTHONPATH: src
        run: |
          uv run --frozen pytest -q
          uv run --frozen ruff check

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build binary
        shell: bash
        run: >
          uv run --frozen --with pyinstaller pyinstaller --onefile
          --name hidemyemail-windows
          --collect-data certifi
          --icon docs/icon.ico
          src/hidemyemail_generator/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/hidemyemail-windows.exe
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            cli_asset: hidemyemail-macos
            app_label: Apple-Silicon
          - runner: macos-26-intel
            arch: x86_64
            cli_asset: hidemyemail-macos-x86_64
            app_label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build CLI and app
        run: |
          scripts/build-macos-app.sh "${{ matrix.arch }}"
          cp "build/macos-app-${{ matrix.arch }}/helper/hidemyemail" \
            "dist/${{ matrix.cli_asset }}"

      - name: Test app
        run: |
          cd macos
          DEVELOPER_DIR="$(../scripts/xcode-developer-dir.sh)" xcodebuild test \
            -scheme HideMyEmailGenerator \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            -derivedDataPath "$PWD/../build/macos-app-${{ matrix.arch }}/xcode" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate app bundle
        shell: bash
        run: |
          app="build/macos-app-${{ matrix.arch }}/HideMyEmail Generator.app"
          plist="$app/Contents/Info.plist"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"

          test -x "$app/Contents/Resources/hidemyemail"
          test -x "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" \
            = "CTtQVjKq6ytg65Ntiv3WLuwMljBcPqW0YB1ep0VLkJw="
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist" \
            | grep -Fq "appcast-${{ matrix.arch }}.xml"
          test "$(lipo -archs "$app/Contents/MacOS/HideMyEmailGenerator")" \
            = "${{ matrix.arch }}"
          test "$(lipo -archs "$app/Contents/Resources/hidemyemail")" \
            = "${{ matrix.arch }}"
          lipo -archs "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" \
            | grep -Fqw "${{ matrix.arch }}"

      - name: Stage unsigned release
        shell: bash
        run: |
          stage="build/unsigned-${{ matrix.arch }}"
          tools="build/macos-app-${{ matrix.arch }}/xcode/SourcePackages/artifacts/sparkle/Sparkle/bin"
          mkdir -p "$stage"
          cp \
            "dist/${{ matrix.cli_asset }}" \
            "dist/HideMyEmail-Generator-macOS-${{ matrix.app_label }}.zip" \
            "dist/HideMyEmail-Generator-macOS-${{ matrix.app_label }}.dmg" \
            "$stage/"
          cp -R "$tools" "$stage/tools"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-${{ matrix.arch }}
          path: build/unsigned-${{ matrix.arch }}/
          if-no-files-found: error

  # Sparkle's generate_appcast / sign_update / BinaryDelta are universal
  # binaries, and signing is over the archive bytes — the tool's architecture
  # need not match the app's. One arm64 runner therefore signs both arches
  # instead of provisioning two macOS runners for shell work.
  sign:
    needs: macos
    if: github.ref_type == 'tag'
    environment: release
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-macos-*
          path: unsigned

      - name: Generate signed appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          tools="unsigned/unsigned-macos-arm64/tools"
          chmod +x \
            "$tools/BinaryDelta" \
            "$tools/generate_appcast" \
            "$tools/sign_update"
          mkdir -p dist

          for arch in arm64 x86_64; do
            case "$arch" in
              arm64) app_label=Apple-Silicon; cli_asset=hidemyemail-macos ;;
              x86_64) app_label=Intel; cli_asset=hidemyemail-macos-x86_64 ;;
            esac

            unsigned="unsigned/unsigned-macos-$arch"
            updates="build/appcast-$arch"
            archive="HideMyEmail-Generator-macOS-$app_label.zip"
            mkdir -p "$updates"
            cp "$unsigned/$archive" "$updates/$archive"

            printf '%s' "$SPARKLE_PRIVATE_KEY" \
              | "$tools/generate_appcast" \
                  --ed-key-file - \
                  --download-url-prefix \
                    "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
                  --link "https://github.com/${GITHUB_REPOSITORY}" \
                  --maximum-deltas 0 \
                  -o "$updates/appcast-$arch.xml" \
                  "$updates"

            cp "$updates/appcast-$arch.xml" dist/
            appcast="dist/appcast-$arch.xml"
            signature="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$appcast")"
            test -n "$signature"
            grep -Fq "/releases/download/${GITHUB_REF_NAME}/$archive" \
              "$appcast"
            printf '%s' "$SPARKLE_PRIVATE_KEY" \
              | "$tools/sign_update" --verify --ed-key-file - \
                  "$updates/$archive" "$signature"

            invalid_signature="${signature%?}A"
            if printf '%s' "$SPARKLE_PRIVATE_KEY" \
              | "$tools/sign_update" --verify --ed-key-file - \
                  "$updates/$archive" "$invalid_signature" >/dev/null 2>&1; then
              echo "Sparkle accepted an invalid update signature for $arch." >&2
              exit 1
            fi

            cp \
              "$unsigned/$cli_asset" \
              "$unsigned/HideMyEmail-Generator-macOS-$app_label.zip" \
              "$unsigned/HideMyEmail-Generator-macOS-$app_label.dmg" \
              dist/
          done

          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  release:
    needs: [windows, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 9
          test -f release-assets/appcast-arm64.xml
          test -f release-assets/appcast-x86_64.xml

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
